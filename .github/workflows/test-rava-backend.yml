name: Test Ravatronix backend

on:
  push:
    branches:
      - feat/rava-realtime-backend
    paths:
      - "backend/**"
      - ".github/workflows/test-rava-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

name: Build Ravatronix ESP32-S3 OV3660 AP+STA Wi-Fi

on:
  workflow_dispatch:
  push:
    branches:
      - feature/camera-apsta-wifi-setup
    paths:
      - "firmware/esp32_s3/camera_wifi_ap_sta/camera_wifi_ap_sta.ino"
      - ".github/workflows/build-esp32s3-apsta.yml"

permissions:
  contents: read

jobs:
  build-apsta:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Configure Arduino CLI
        run: arduino-cli config init
      - name: Install ESP32 Arduino core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile AP+STA camera firmware for ESP32-S3 N16R8
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashMode=qio,FlashSize=16M,PSRAM=opi,PartitionScheme=huge_app,CPUFreq=240" \
            --output-dir build \
            firmware/esp32_s3/camera_wifi_ap_sta
          test -s build/camera_wifi_ap_sta.ino.merged.bin
          cp build/camera_wifi_ap_sta.ino.merged.bin build/Ravatronix_ESP32S3_N16R8_OV3660_AP_STA_merged.bin
          test -s build/Ravatronix_ESP32S3_N16R8_OV3660_AP_STA_merged.bin
          stat -c '%n %s bytes' build/Ravatronix_ESP32S3_N16R8_OV3660_AP_STA_merged.bin
      - name: Upload AP+STA firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ravatronix-ESP32S3-N16R8-OV3660-AP-STA
          path: build/Ravatronix_ESP32S3_N16R8_OV3660_AP_STA_merged.bin
          if-no-files-found: error
          retention-days: 14

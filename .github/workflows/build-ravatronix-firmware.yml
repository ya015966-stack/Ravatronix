name: Build Ravatronix integrated ESP-IDF firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP-IDF firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: firmware/esp32_s3
          command: |
            set -euo pipefail
            python -m pip install pytest
            python -m pytest tests/host -q
            idf.py reconfigure
            idf.py build
            python -m esptool --chip esp32s3 merge_bin -o build/Ravatronix_ESP32S3_N16R8.bin -f raw --flash_mode dio --flash_freq 40m --flash_size 16MB 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/ravatronix_firmware.bin
            test -s build/Ravatronix_ESP32S3_N16R8.bin
      - uses: actions/upload-artifact@v4
        with:
          name: Ravatronix-ESP32S3-N16R8-Integrated
          path: firmware/esp32_s3/build/Ravatronix_ESP32S3_N16R8.bin
          if-no-files-found: error
          retention-days: 14

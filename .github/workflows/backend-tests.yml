name: Backend tests

on:
  push:
    branches:
      - feat/rava-free-chat-core
      - feat/rava-cloudflare-workers-ai-config
  pull_request:
    branches:
      - feat/rava-realtime-backend
      - feat/rava-openai-compatible-provider

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install --no-package-lock
      - run: npm test

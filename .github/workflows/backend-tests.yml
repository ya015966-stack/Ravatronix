name: RAVA Backend Tests

on:
  push:
    branches:
      - feat/rava-ai-voice-v1
      - feat/rava-websocket-ai-chat
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run backend tests
        run: npm test

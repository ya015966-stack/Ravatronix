name: Build RAVA ESP32-S3 serial test

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/esp32_s3/serial_test/serial_test.ino"
      - ".github/workflows/build-esp32s3.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: arduino-cli config init

      - name: Install ESP32 platform
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Compile serial test for generic ESP32-S3
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32s3 --output-dir build firmware/esp32_s3/serial_test

      - name: List build output
        run: ls -lh build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: rava-esp32s3-serial-test
          path: |
            build/*.bin
          if-no-files-found: error
          retention-days: 14

name: Build RAVA ESP32-S3 DIO serial test

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/esp32_s3/serial_test/serial_test.ino"
      - ".github/workflows/build-esp32s3.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: arduino-cli config init

      - name: Install ESP32 platform
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Show ESP32-S3 board options
        run: arduino-cli board details --fqbn esp32:esp32:esp32s3

      - name: Compile DIO serial test for ESP32-S3 N16R8
        run: |
          mkdir -p build
          arduino-cli compile --fqbn "esp32:esp32:esp32s3:FlashMode=dio,FlashSize=16M,PSRAM=opi" --output-dir build firmware/esp32_s3/serial_test
          test -s build/serial_test.ino.merged.bin
          test "$(stat -c%s build/serial_test.ino.merged.bin)" -ge 16000000
          cp build/serial_test.ino.merged.bin build/RAVA_ESP32S3_N16R8_DIO_merged.bin
          echo "Merged DIO image:"
          stat -c '%n %s bytes' build/RAVA_ESP32S3_N16R8_DIO_merged.bin

      - name: Upload single merged DIO image
        uses: actions/upload-artifact@v4
        with:
          name: rava-esp32s3-n16r8-dio-serial-test
          path: build/RAVA_ESP32S3_N16R8_DIO_merged.bin
          if-no-files-found: error
          retention-days: 14

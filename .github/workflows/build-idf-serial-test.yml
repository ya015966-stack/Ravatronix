name: Build RAVA ESP32-S3 ESP-IDF serial test

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/esp32_s3/idf_serial_test/**"
      - ".github/workflows/build-idf-serial-test.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure ESP32-S3 target
        working-directory: firmware/esp32_s3/idf_serial_test
        run: idf.py set-target esp32s3

      - name: Build minimal ESP-IDF firmware
        working-directory: firmware/esp32_s3/idf_serial_test
        run: idf.py build

      - name: Create merged image for offset 0x0
        working-directory: firmware/esp32_s3/idf_serial_test
        run: |
          esptool.py --chip esp32s3 merge-bin \
            -o build/RAVA_ESP32S3_IDF_QIO_serial_test.bin \
            --flash_mode qio --flash_size 16MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/rava_idf_serial_test.bin
          test -s build/RAVA_ESP32S3_IDF_QIO_serial_test.bin
          stat -c '%n %s bytes' build/RAVA_ESP32S3_IDF_QIO_serial_test.bin

      - name: Upload merged firmware and individual images
        uses: actions/upload-artifact@v4
        with:
          name: rava-esp32s3-idf-qio-serial-test
          path: |
            firmware/esp32_s3/idf_serial_test/build/RAVA_ESP32S3_IDF_QIO_serial_test.bin
            firmware/esp32_s3/idf_serial_test/build/bootloader/bootloader.bin
            firmware/esp32_s3/idf_serial_test/build/partition_table/partition-table.bin
            firmware/esp32_s3/idf_serial_test/build/rava_idf_serial_test.bin
          if-no-files-found: error
          retention-days: 14

name: Build Ravatronix ESP-IDF firmware

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-esp32s3:
    name: ESP32-S3-N16R8 firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python and run firmware host tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run firmware host tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest firmware/esp32_s3/tests/host -q

      - name: Install ESP-IDF v5.3.2
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.3.2

      - name: Build and merge firmware
        shell: bash
        run: |
          cd firmware/esp32_s3
          idf.py set-target esp32s3
          idf.py reconfigure
          idf.py build
          idf.py merge-bin -f raw

      - name: Verify and name merged firmware
        shell: bash
        run: |
          test -s firmware/esp32_s3/build/merged-binary.bin
          cp firmware/esp32_s3/build/merged-binary.bin firmware/esp32_s3/build/Ravatronix_ESP32S3_N16R8_IDF_merged.bin
          stat -c '%n %s bytes' firmware/esp32_s3/build/Ravatronix_ESP32S3_N16R8_IDF_merged.bin

      - name: Upload ESP-IDF firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ravatronix-ESP32S3-N16R8-ESP-IDF
          path: |
            firmware/esp32_s3/build/Ravatronix_ESP32S3_N16R8_IDF_merged.bin
            firmware/esp32_s3/build/flasher_args.json
          if-no-files-found: error
          retention-days: 14
